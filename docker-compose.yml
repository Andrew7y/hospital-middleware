services:
  postgres:
    image: postgres:15-alpine
    container_name: hospital-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - hospital-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-api
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - hospital-network

  nginx:
    image: nginx:1.29-alpine
    container_name: hospital-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - hospital-network

volumes:
  postgres_data:

networks:
  hospital-network:
    driver: bridge